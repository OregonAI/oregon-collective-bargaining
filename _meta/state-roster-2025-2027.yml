# The state tier's COVERAGE FLOOR: the DAS Labor Relations Unit 2025-2027 Bargaining
# Chart, transcribed from the chart PDF (rev. 03/19/2026) and verified against a
# pdftotext extraction of the archived fetch (corpus-seeds/.cba-survey/
# fetches-2026-08-02/ratification.pdf). This is the enumerable "should exist" list
# the way oregon-audits uses its report list: src/enumerate_cbas.py reconciles the
# document library against it and NAMES every roster row with no current-term file.
#
# `match` is a case-sensitive substring of the library FILENAME for this unit's
# agreements — hand-recorded once, because DAS filenames are not derivable from the
# chart (chart "DHS SACU" vs filename "DHS Stabilization and Crisis Unit"; chart
# "IAFF KFFA Klamath Falls" vs filename "IAFF Kingsley Firefighters" — Kingsley
# Field IS the Klamath Falls air base; chart "OHA RN" vs filename "AFSCME OSH
# Registered Nurses" — the Oregon State Hospital nurses bargain under OHA).
# `exclude` disambiguates prefix collisions (DOC Security vs DOC Security Plus).
#
# The chart counts 12 unions / 36 state units / 35 contracts: SEIU's two rows
# (strike-permitted and strike-prohibited units) share ONE master agreement, so the
# roster below carries them as one contract entry covering both rows.
source: https://www.oregon.gov/das/HR/Documents/2025-2027-Ratification-Dates.pdf
chart_revision: "03/19/2026"
term: 2025-2027

state_contracts:
- {unit: AEE Assn. of Engineering Employees,              repr: E,        ratified: 2026-01-06, match: "AEE Association of Engineering Employees"}
