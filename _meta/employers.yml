- slug: linn-county
  name: Linn County
  kind: county
  jurisdiction: oregon/linn-county
  source_url: https://www.linncountyor.gov/administration/page/union-contracts
  survey_status: could-not-verify
  built: false
  status_reason: >-
    The agreements ARE published by the county, not absent: linncountyor.gov returns
    HTTP 403 (Cloudflare managed challenge) to an honestly-identified fetcher on every
    path except robots.txt. First measured in the 2026-08-02 survey (three attempts,
    same result); re-tested 2026-10-01 with the corpus-toolkit Fetcher per issue #8
    (curl and the toolkit can disagree) and still 403. Cloudflare Verified Bots
    registration, the plan to unblock this at the toolkit level, is permanently
    unavailable to this project (home network, no attestable IP space — operator
    ruling 2026-09-11, recorded in oregon-counties/_meta/counties.yml and
    oregon-counties#116). A records request was drafted and then DECLINED by the
    operator, 2026-09-12 (issue #8).
  status_reason_date: '2026-10-01'
