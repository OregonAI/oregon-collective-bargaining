# Employer registry — the issuing-body registry the scoped content root validates
# against (corpus.yml: issuing_body_registry_key: employers). One entry per employer
# whose agreements this corpus can hold: the state, plus all 36 counties so that a
# county's absence from the CONTENT is never mistaken for absence from the UNIVERSE.
#
# County slugs are IDENTICAL to oregon-counties' _meta/counties.yml slugs on purpose —
# the cross-corpus county join depends on it. Generated from that registry plus
# corpus-seeds/oregon-collective-bargaining.survey.yml; survey_status is the survey's
# vocabulary (verified / could-not-verify / not-located / not-investigated — kept
# apart, never summed). source_url is the employer's own labor-agreements index where
# the survey recorded one — including the two whose index refused the honest fetcher
# (could-not-verify); check survey_status before trusting it. null means "no index
# located", NOT "no agreements".
#
# status_reason / status_reason_date   Set on every `built: false` row (issue #8):
#                   WHY it is unbuilt and WHEN that was established, so a reader can
#                   tell "the county blocks us" from "nobody has looked yet" from
#                   "nothing public was found" without reading GitHub. Never a
#                   tri-state on `built` — `built` stays a plain built/not-built flag;
#                   the reason lives beside it, same split as oregon-counties'
#                   `deferred` + `deferred_reason`. A `could-not-verify` reason records
#                   that the agreements ARE published and OUR fetch is blocked, never
#                   that the county has none. A `not-located` reason records the date
#                   of the search, never the county's labor-relations status — Oregon
#                   counties bargain; ORS 243 requires it. Also set on jackson-county,
#                   which stays `built: true` / `verified` but is only partially held.
#
#                   CLOSED, 2026-09-12 (operator, oregon-collective-bargaining#8): the
#                   ORS 192.311–192.478 records requests drafted for Josephine, Polk,
#                   Umatilla, Klamath, Jackson (AFSCME unit) are DECLINED, not
#                   deferred — nobody should re-derive or send them expecting a
#                   different answer. What replaces them is this field: make the
#                   registry honest about why each county is unbuilt, and stop there.
employers:
