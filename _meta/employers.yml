  source_url: https://jacksoncountyor.gov/departments/administration/human_resources/labor_agreements.php
  survey_status: verified
  built: true
  status_reason: >-
    Partially held, not fully unbuilt: 4 units are ingested from the county's own index.
    The AFSCME unit's Oregon agreement remains publicly unlocated — the mijackson.org
    lead found during the survey was Jackson County, MICHIGAN, not this one, so it is a
    dead lead and should not be re-chased. A records request for this one unit was
