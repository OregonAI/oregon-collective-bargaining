# Employer registry — the issuing-body registry the scoped content root validates
# against (corpus.yml: issuing_body_registry_key: employers). One entry per employer
# whose agreements this corpus can hold: the state, plus all 36 counties so that a
# county's absence from the CONTENT is never mistaken for absence from the UNIVERSE.
#
# County slugs are IDENTICAL to oregon-counties' _meta/counties.yml slugs on purpose —
# the cross-corpus county join depends on it. Generated from that registry plus
# corpus-seeds/oregon-collective-bargaining.survey.yml; survey_status is the survey's
# vocabulary (verified / could-not-verify / not-located / not-investigated — kept
# apart, never summed). source_url is the employer's own labor-agreements index where
# the survey recorded one — including the two whose index refused the honest fetcher
# (could-not-verify); check survey_status before trusting it. null means "no index
# located", NOT "no agreements".
employers:
- slug: state
  name: State of Oregon (DAS Labor Relations Unit)
  kind: state
  jurisdiction: oregon
  source_url: https://www.oregon.gov/das/hr/pages/lru.aspx
  survey_status: verified
  built: true
