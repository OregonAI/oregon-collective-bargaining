  built: false
  status_reason: >-
    The agreements ARE published by the county, not absent: douglascountyor.gov returns
    a plain HTTP 403 to an honestly-identified fetcher (search-result artifacts from the
    survey show the page covers Teamsters 554, IUOE 571, AFSCME 251, EULA, FOP Lodges 2
