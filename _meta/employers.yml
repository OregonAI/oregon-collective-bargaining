    attempts, same result); re-tested 2026-10-01 with the corpus-toolkit Fetcher per
    issue #8 (curl and the toolkit can disagree) and still 403. Cloudflare Verified
    Bots registration is permanently unavailable to this project (operator ruling
    2026-09-11, oregon-counties#116). A records request was drafted and then DECLINED
    by the operator, 2026-09-12 (issue #8).
  status_reason_date: '2026-10-01'
