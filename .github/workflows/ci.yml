name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.23.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.23.0
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.23.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.23.0
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.23.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.23.0
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      #
      # agreements/ JOINED THAT LIST AT THE VERBATIM FLIP, for exactly the snapshot
      # reason: the bodies are now the contracts themselves, so every URL an employer
      # and a union wrote into an agreement is inside them. The first run after the
      # flip failed on nine — a county intranet page (web1.clackamas.us/des/
      # drugtesting.html) cited by two 2020-era agreements, and a DHS form whose TLS
      # chain lychee will not trust. NONE OF THOSE ARE ACTIONABLE HERE. A dead URL
      # inside a ratified contract is a historical fact about that contract; editing
      # it would alter the mirrored text, which is the one thing this corpus must
      # never do, and provenance would reject the edit anyway. The set only grows as
      # agreements are added.
      #
      # What this does NOT give up: source_url reachability, which is frontmatter and
      # was never lychee's job — the weekly `drift` job in scheduled.yml fetches every
      # source_url, which is the same "upstream availability lives in the scheduled
      # job" split the snapshot exclusion above already makes. Relationship integrity
      # is still gated here, by the workflow's own corpus-validate-frontmatter step.
      #
      # A surgical alternative — exclude by URL pattern rather than by path — is not
      # available: the reusable workflow exposes only exclude-paths and accept-codes.
      # Filed as corpus-toolkit#51.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        agreements

  # EVERY COMMITTED GENERATED ARTIFACT MUST BE CURRENT, checked on every PR.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere.
  #
  # What this corpus commits, and what covers it:
  #
  #   _meta/graph.json   src/build_graph.py         this job, every PR
  #   STATUS.md          corpus-generate-status     this job, every PR
  #
  # STATUS.md is also regenerated and committed by the weekly `drift` job in
  # scheduled.yml. That is a repair, not a gate: between Mondays a PR can merge a
  # document and leave the published status wrong for six days with nothing saying so.
  #
  # _meta/corpus-index.json is deliberately ABSENT from this list. The platform builds
  # it at deploy time in pages.yml (via src/build_site.py) and never commits it,
  # precisely so it cannot fall behind its own corpus in a way that damages a SIBLING
  # repo's citation resolution. Do not commit one and then gate it here; publish it
  # instead.
  #
  # That reasoning once named publish-index.yml, a workflow deleted from main in
  # fc86a85. Deleting it from main did not stop it: GitHub fires `schedule` only from
  # the DEFAULT branch, this repo's default branch was still the pre-ingest
  # discovery/state-and-county-sources, and the copy living there kept running weekly
  # against a tree with zero documents -- publishing `{"n_documents": 0}` over the good
  # index and passing green, because generating an index for an empty corpus is not an
  # error. Fixed by pointing the default branch at main (issue #12).
  #
  # ADD A STEP HERE FOR EVERY GENERATED FILE YOU COMMIT. A generated file with no step
  # is the failure this whole job exists to prevent, and it is silent by construction.
  #
  # Note the checks are `--check` rather than `git diff --exit-code`: STATUS.md carries
  # a "Generated <date>" line, so a raw diff would fail every day for a reason that is
  # not drift. Both `--check` implementations compare CONTENT and print the exact
  # command to re-run.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # THIRD PIN, and yes that is one more than there should be. `uses:` above selects
      # the workflow file, `toolkit-ref:` selects the code it installs, and this selects
      # the code THIS job installs. All three must move together; a bump that misses one
      # runs new checks against old code. Tracked as corpus-toolkit#9.
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: v1.23.0
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      - name: Authority graph must be current
        run: python3 src/build_graph.py --check
      # The county source groups are generated from the archived discovery fetches
      # committed under _meta/discovery/ — deterministic, no network. The STATE group
      # (src/enumerate_cbas.py --check) is deliberately NOT here: it enumerates a live
      # SharePoint endpoint, and network flake does not belong in the PR gate — it runs
      # in scheduled.yml's weekly drift job instead, the oregon-audits arrangement.
      - name: County source groups must be current
        run: python3 src/discover_counties.py --check
      # The llms.txt Contents stub must not survive into a real corpus. Five live
      # corpora carried the template's HTML-comment placeholder for weeks — an advertised
      # agent entry point serving an empty index — because nothing ever forced the fill
      # (corpus-template#16). Guarded here, not on the template itself: the template still
      # carries {{CORPUS_NAME}} placeholders, and a repo that still has THOSE is the
      # template (or an instantiation nobody finished, which contract_smoke catches).
      - name: llms.txt Contents must be filled in
        run: |
          if ! grep -q "{{CORPUS_NAME}}" llms.txt && grep -q "One annotated link per" llms.txt; then
            echo "llms.txt still carries the template's Contents stub — fill it in" >&2
            exit 1
          fi
      - name: STATUS.md must be current
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md --check
      # THE GATE PROVENANCE CANNOT BE. corpus-verify-provenance compares the body
      # against the snapshot; when the SNAPSHOT is garbage the two agree perfectly and
      # it passes while the corpus publishes noise as the terms of a labor contract.
      # Four such extractions were found at the verbatim flip — one a raw PDF committed
      # under a .txt name, two whose font encoding pdftotext could not map, one that
      # yielded 2% of a 53-page agreement. This fails on any NEW one.
      - name: Every committed extraction must be readable text
        run: python3 src/extraction_quality.py --check
      # Anchors and bodies are written by two passes that must not drift: the snapshot
      # carries `### ` article anchors and the body is a copy of it. If either is
      # re-run without the other, provenance still passes (the hash is recomputed from
      # whichever the body came from) but navigation silently rots.
      - name: Article anchors must be current
        run: python3 src/anchor_sections.py --check
      - name: Full text must match its extraction
        run: python3 src/promote_full_text.py --check
